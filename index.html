<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physick</title>
    <link rel="icon" type="image/svg+xml" href="./assets/physick-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>

    <div id="splash">
      <img class="logo" src="./assets/physick-logo.svg" alt="Physick" />
      <div class="go">Click to start</div>
      <small>Sound on</small>
    </div>

    <div id="loadpop" class="hidden">
      <i class="spin"></i>
      <div><b>Loading Verian</b><span id="loading">…</span><div class="bar"><i></i></div></div>
    </div>

    <div id="overlay" class="title">
      <div class="card">
        <img class="logo" src="./assets/physick-logo.svg" alt="Physick" />
        <button class="play" disabled>Click to play</button>
        <button class="settings-btn" id="btn-settings">Settings</button>
        <div id="pad-status"></div>
        <div class="controls">
          <div><kbd>W A S D</kbd> walk / drive · <kbd>Space</kbd> jump · <kbd>Shift</kbd> run</div>
          <div><kbd>LMB</kbd> grab / punch · <kbd>RMB</kbd> throw · <kbd>F</kbd> use</div>
          <div><kbd>E</kbd> interact · <kbd>B</kbd> bag it · <kbd>Tab</kbd> open bag</div>
          <div><kbd>M</kbd> map · <kbd>J</kbd> phone · <kbd>Esc</kbd> pause</div>
        </div>
      </div>
    </div>

    <div id="panel" class="hidden">
      <div class="panel">
        <div class="menu-head"><h2>Bag</h2><button class="close">Close</button></div>
        <div class="body"></div>
      </div>
    </div>

    <div id="settings" class="hidden">
      <div class="panel">
        <div class="menu-head"><h2>Settings</h2><button class="close">Close</button></div>
        <div class="rows"></div>
      </div>
    </div>

    <script>
      // If the game script can't load at all, say so instead of sitting on "Loading…" forever.
      addEventListener('error', (e) => {
        const el = document.getElementById('loading');
        if (el && !window.physick) el.textContent = 'Failed to start: ' + (e.message || 'a file could not be loaded');
      });
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
